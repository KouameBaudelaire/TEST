name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
 
    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

  
      # 2. Se connecter à GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build + Push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5  
        with:
          context: .
          push: true
          tags: ghcr.io/KouameBaudelaire/test/mp-site:latest
