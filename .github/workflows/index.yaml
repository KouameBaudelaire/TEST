name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
 
    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          persist-credentials: false

          # 2. Installer Python 
      - name: Set up Python 
        uses: actions/setup-python@42375524c7a69c8c45b658e32d9d7c3b1f6f0f16 # v5 
        with: 
          python-version: "3.12" 
          
        # 3. Installer pre-commit 
      - name: Install pre-commit 
        run: pip install pre-commit 
      
      # 4. Exécuter les hooks pre-commit 
      - name: Run pre-commit 
        run: pre-commit run --all-files

  
      # 2. Se connecter à GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build + Push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 #v5  
        with:
          context: .
          push: true
          tags: ghcr.io/kouamebaudelaire/test/mp-site:latest
